# Dos tonos propios (claro y oscuro). "Apariencia" (barra superior de la app) elige Sistema, Claro u Oscuro
# usando el menu de Streamlit, que queda oculto con CSS (por eso toolbarMode es "viewer"). Los colores deben
# coincidir con los tokens de modules/estilo.py.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1A5FD0"
backgroundColor = "#EEF2F7"
secondaryBackgroundColor = "#E3E9F2"
textColor = "#0E1A2F"

[theme.dark]
primaryColor = "#6CB0FF"
backgroundColor = "#070D1A"
secondaryBackgroundColor = "#141E33"
textColor = "#E9EFF9"

[client]
toolbarMode = "viewer"

# Sirve la carpeta static/ (ahi esta el manual: app/static/manual.html)
[server]
enableStaticServing = true
